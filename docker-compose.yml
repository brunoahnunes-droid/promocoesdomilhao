version: "3.9"

services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped

  worker:
    build: .
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
    command: celery -A app.worker.celery_app worker --loglevel=info
    restart: unless-stopped

  beat:
    build: .
    env_file: .env
    depends_on:
      - worker
    volumes:
      - .:/app
    command: celery -A app.worker.celery_app beat --loglevel=info
    restart: unless-stopped

  flower:
    build: .
    env_file: .env
    ports:
      - "5555:5555"
    depends_on:
      - worker
    volumes:
      - .:/app
    command: celery -A app.worker.celery_app flower --port=5555
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pramo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pramo123}
      POSTGRES_DB: ${POSTGRES_DB:-pramoao}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pramo}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
