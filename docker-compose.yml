networks:
  internal:
    driver: bridge

services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
    networks:
      - internal
    # Produção: trocar --reload por --workers 4
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped

  worker:
    build: .
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
    networks:
      - internal
    command: celery -A app.worker.celery_app worker --loglevel=info --pool=prefork
    restart: unless-stopped

  beat:
    build: .
    env_file: .env
    depends_on:
      - worker
    volumes:
      - .:/app
    networks:
      - internal
    command: celery -A app.worker.celery_app beat --loglevel=info
    restart: unless-stopped
    deploy:
      replicas: 1  # nunca escalar beat — evita execução duplicada de tarefas

  flower:
    build: .
    env_file: .env
    ports:
      - "127.0.0.1:5555:5555"  # exposto apenas no loopback — não acessível de fora
    depends_on:
      - worker
    volumes:
      - .:/app
    networks:
      - internal
    command: >
      celery -A app.worker.celery_app flower
      --port=5555
      --basic_auth=${FLOWER_USER:-admin}:${FLOWER_PASSWORD:-CHANGE_ME}
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pramo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-CHANGE_ME}
      POSTGRES_DB: ${POSTGRES_DB:-pramoao}
    # Porta NÃO exposta ao host — acessível apenas pela rede interna Docker
    networks:
      - internal
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pramo}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: always
    # Porta NÃO exposta ao host
    networks:
      - internal
    volumes:
      - redis_data:/data
    command: redis-server --requirepass ${REDIS_PASSWORD:-CHANGE_ME}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-CHANGE_ME}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
