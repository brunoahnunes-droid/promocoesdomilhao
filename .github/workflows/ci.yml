name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint with ruff
        run: |
          pip install ruff
          ruff check app/

      - name: Type check with mypy
        run: |
          pip install mypy
          mypy app/ --ignore-missing-imports

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t pramoao:test .

      - name: Smoke test — health endpoint
        run: |
          docker run -d --name pramoao_test -p 8000:8000 \
            -e TELEGRAM_BOT_TOKEN=test \
            -e TELEGRAM_CHAT_ID=test \
            -e REDIS_URL=redis://localhost:6379/0 \
            pramoao:test
          sleep 5
          curl --fail http://localhost:8000/api/health || (docker logs pramoao_test && exit 1)
          docker stop pramoao_test
